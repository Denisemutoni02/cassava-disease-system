# Optional: managed PostgreSQL+PostGIS for local development.
#   docker compose up -d db
# Then run the backend as described in README (DATABASE_URL already matches).
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: cassavaguard-db
    environment:
      POSTGRES_USER: cassava
      POSTGRES_PASSWORD: cassava
      POSTGRES_DB: cassava
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cassava -d cassava"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
